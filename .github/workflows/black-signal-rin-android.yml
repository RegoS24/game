name: BLACK SIGNAL RIN — Android APK
on:
  workflow_dispatch:
  push:
    branches: [black-signal-rin]
    paths: ['black-signal-rin/**', '.github/workflows/black-signal-rin-android.yml']
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: black-signal-rin
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: 'false'
      - name: Install Android build tools
        run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
      - name: Prepare WebView-compatible game
        run: |
          npm install --no-save --no-package-lock esbuild@0.25.12 playwright@1.56.1
          node prepare-webview.cjs
      - name: Test inventory on desktop and mobile browsers
        run: |
          npx playwright install --with-deps chromium
          node smoke-inventory.cjs
          node smoke-tactical.cjs
      - name: Upload inventory screenshots
        uses: actions/upload-artifact@v4
        with:
          name: INVENTORY-PREVIEWS
          path: |
            black-signal-rin/inventory-desktop.png
            black-signal-rin/inventory-mobile.png
            black-signal-rin/tactical-mobile.png
      - name: Restore persistent development signing key
        id: signing-cache
        uses: actions/cache/restore@v4
        with:
          path: black-signal-rin/out/debug.keystore
          key: black-signal-rin-dev-signing-v1
      - name: Build APK
        run: |
          bash build-apk.sh
          unzip -t out/BLACK-SIGNAL-RIN.apk
          unzip -Z1 out/BLACK-SIGNAL-RIN.apk | grep -Fx 'classes.dex'
          unzip -Z1 out/BLACK-SIGNAL-RIN.apk | grep -Fx 'assets/index.html'
      - name: Save development signing key
        uses: actions/cache/save@v4
        if: steps.signing-cache.outputs.cache-hit != 'true'
        with:
          path: black-signal-rin/out/debug.keystore
          key: black-signal-rin-dev-signing-v1
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify installation and game launch on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: cd black-signal-rin && bash smoke-android.sh
      - name: Upload Android diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ANDROID-LAUNCH-DIAGNOSTICS
          path: |
            black-signal-rin/out/android-smoke.log
            black-signal-rin/out/android-gameplay.png
          if-no-files-found: ignore
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BLACK-SIGNAL-RIN-APK
          path: black-signal-rin/out/BLACK-SIGNAL-RIN.apk
      - name: Publish APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="black-signal-rin-v0.5.1-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" out/BLACK-SIGNAL-RIN.apk --target "$GITHUB_SHA" --title "BLACK SIGNAL RIN — v0.5.1 ($GITHUB_RUN_NUMBER)" --notes 'Development build. APK install and actual game launch verified on Android emulator. Offline, landscape.' --prerelease
