name: BLACK SIGNAL source regression guard

on:
  push:
    branches: [black-signal-hd2d]
  pull_request:
    paths:
      - 'black-signal-hd2d/**'
      - '.github/workflows/black-signal-source-guard.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-regression:
    name: Validate GDScript source and Python test syntax
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Compile Python regression scripts
        working-directory: black-signal-hd2d
        run: python3 -m compileall -q tests
      - name: Reject escaped GDScript newlines
        working-directory: black-signal-hd2d
        run: python3 tests/test_escaped_newlines.py
