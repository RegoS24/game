name: BLACK SIGNAL source regression guard

on:
  push:
    branches: [black-signal-hd2d]
  pull_request:
    paths:
      - 'black-signal-hd2d/**'
      - '.github/workflows/black-signal-source-guard.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-regression:
    name: Validate GDScript source and Python test syntax
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Compile Python regression scripts
        working-directory: black-signal-hd2d
        run: python3 -m compileall -q tests
      - name: Reject duplicate GDScript methods
        run: python3 black-signal-hd2d/tests/test_gdscript_duplicate_methods.py
      - name: Validate Android lifecycle regression
        run: python3 black-signal-hd2d/tests/test_android_lifecycle.py
      - name: Check combat AI, directional art and checkpoint safety contracts
        working-directory: black-signal-hd2d
        run: |
          python3 tests/test_enemy_attack_commitment.py
          python3 tests/test_enemy_cover_flank.py
          python3 tests/test_enemy_hit_interrupt.py
          python3 tests/test_enemy_hit_stun.py
          python3 tests/test_enemy_side_mirror.py
          python3 tests/test_checkpoint_size_guard.py
      - name: Reject escaped GDScript newlines
        working-directory: black-signal-hd2d
        run: python3 tests/test_escaped_newlines.py
