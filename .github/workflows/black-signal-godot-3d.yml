name: BLACK SIGNAL native 3D
on:
  workflow_dispatch:
  push:
    branches: [black-signal-godot-3d]
    paths: ['black-signal-godot-3d/**', '.github/workflows/black-signal-godot-3d.yml']
permissions:
  contents: write
concurrency:
  group: godot-3d-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: 'false'
      - name: Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.1'
      - name: Godot engine and Android export templates
        shell: bash
        run: |
          set -eux
          curl -fL --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.5.1-stable/Godot_v4.5.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install -m 755 /tmp/godot/Godot_v4.5.1-stable_linux.x86_64 /usr/local/bin/godot
          curl -fL --retry 3 -o /tmp/templates.tpz https://github.com/godotengine/godot-builds/releases/download/4.5.1-stable/Godot_v4.5.1-stable_export_templates.tpz
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          mkdir -p "$HOME/.local/share/godot/export_templates"
          mv /tmp/godot-templates/templates "$HOME/.local/share/godot/export_templates/4.5.1.stable"
          mkdir -p "$HOME/.config/godot" "$HOME/.android"
          keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android/android_sdk_path = "%s"\nexport/android/java_sdk_path = "%s"\nexport/android/debug_keystore = "%s"\n' "$ANDROID_HOME" "$JAVA_HOME" "$HOME/.android/debug.keystore" > "$HOME/.config/godot/editor_settings-4.5.tres"
          godot --version
      - name: Import project and parse scripts
        run: godot --headless --path black-signal-godot-3d --editor --import --quit 2>&1 | tee import.log; ! grep -E 'SCRIPT ERROR|Parse Error|Shader compilation failed' import.log
      - name: Native 3D smoke test
        run: |
          set -o pipefail
          timeout 120 godot --headless --path black-signal-godot-3d -- --smoke 2>&1 | tee smoke.log
          grep -q BS3D_SMOKE_PASS smoke.log
          ! grep -E 'SCRIPT ERROR|Parse Error' smoke.log
      - name: Export native Android APK
        run: |
          mkdir -p dist
          godot --headless --path black-signal-godot-3d --export-debug Android "$PWD/dist/BLACK-SIGNAL-3D.apk"
          test -s dist/BLACK-SIGNAL-3D.apk
          unzip -Z1 dist/BLACK-SIGNAL-3D.apk | grep -E 'lib/arm64-v8a/libgodot_android.so'
          "$ANDROID_HOME/build-tools/35.0.1/apksigner" verify --verbose dist/BLACK-SIGNAL-3D.apk
      - name: Upload APK for testing
        uses: actions/upload-artifact@v4
        with:
          name: BLACK-SIGNAL-3D-APK
          path: dist/BLACK-SIGNAL-3D.apk
      - name: Publish development build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "black-signal-3d-v0.6-${GITHUB_RUN_NUMBER}" dist/BLACK-SIGNAL-3D.apk --target "$GITHUB_SHA" --title "BLACK SIGNAL 3D — v0.6 (${GITHUB_RUN_NUMBER})" --notes "Native Godot 3D development build. Headless smoke test passed. Android device playability and AAA graphics are not yet verified." --prerelease
