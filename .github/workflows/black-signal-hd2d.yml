name: BLACK SIGNAL native HD2D
on:
  workflow_dispatch:
  push:
    branches: [black-signal-hd2d]
    paths: ['black-signal-hd2d/**', '.github/workflows/black-signal-hd2d.yml']
permissions:
  contents: write
concurrency:
  group: godot-hd2d-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: 'false'
      - name: Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.1' 'emulator'
      - name: Restore development signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: black-signal-nativehd2d-debug-signing-v1
      - name: Godot engine and Android export templates
        shell: bash
        run: |
          set -eux
          curl -fL --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.5.1-stable/Godot_v4.5.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install -m 755 /tmp/godot/Godot_v4.5.1-stable_linux.x86_64 /usr/local/bin/godot
          curl -fL --retry 3 -o /tmp/templates.tpz https://github.com/godotengine/godot-builds/releases/download/4.5.1-stable/Godot_v4.5.1-stable_export_templates.tpz
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          mkdir -p "$HOME/.local/share/godot/export_templates"
          mv /tmp/godot-templates/templates "$HOME/.local/share/godot/export_templates/4.5.1.stable"
          mkdir -p "$HOME/.config/godot" "$HOME/.android"
          test -f "$HOME/.android/debug.keystore" || keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android/android_sdk_path = "%s"\nexport/android/java_sdk_path = "%s"\nexport/android/debug_keystore = "%s"\n' "$ANDROID_HOME" "$JAVA_HOME" "$HOME/.android/debug.keystore" > "$HOME/.config/godot/editor_settings-4.5.tres"
          cp "$HOME/.config/godot/editor_settings-4.5.tres" "$HOME/.config/godot/editor_settings-4.tres"
          godot --version
      - name: Generate and validate animation atlases
        run: |
          python -m pip install numpy pillow opencv-python-headless
          python black-signal-hd2d/prepare_atlases.py | tee /tmp/rin_stable.log
          grep -q RIN_STABLE_RESAMPLE_OK /tmp/rin_stable.log
          python black-signal-hd2d/prepare_mobs.py
          python black-signal-hd2d/prepare_locomotion.py | tee /tmp/rin_gait.log
          for gait in run crouch_walk crawl; do grep -q "RIN_ALTERNATION_OK $gait" /tmp/rin_gait.log; done
          python black-signal-hd2d/pack_rin_90fps.py | tee /tmp/rin90.log
          grep -q "RIN90_READY 742" /tmp/rin90.log
      - name: Import project and parse scripts
        run: |
          set -o pipefail
          godot --headless --path black-signal-hd2d --editor --import --quit 2>&1 | tee import.log
          python black-signal-hd2d/enable_rin_mipmaps.py
          godot --headless --path black-signal-hd2d --editor --import --quit 2>&1 | tee import_mips.log
          ! grep -E 'SCRIPT ERROR|Parse Error|Shader compilation failed' import_mips.log
          ! grep -E 'SCRIPT ERROR|Parse Error|Shader compilation failed' import.log
      - name: Native HD2D smoke test
        run: |
          set -o pipefail
          timeout 120 godot --headless --path black-signal-hd2d -- --smoke 2>&1 | tee smoke.log
          grep -q BLACK_SIGNAL_SMOKE_OK smoke.log
          grep -q RIN90_CADENCE_OK smoke.log
          ! grep -E 'SCRIPT ERROR|Parse Error|Invalid polygon data' smoke.log
      - name: Export native Android APK
        run: |
          mkdir -p dist
          export GODOT_ANDROID_KEYSTORE_DEBUG_PATH="$HOME/.android/debug.keystore"
          export GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey
          export GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android
          godot --headless --verbose --path black-signal-hd2d --export-debug Android "$PWD/dist/BLACK-SIGNAL-HD2D.apk"
          test -s dist/BLACK-SIGNAL-HD2D.apk
          unzip -Z1 dist/BLACK-SIGNAL-HD2D.apk | grep -E 'lib/arm64-v8a/libgodot_android.so'
          "$ANDROID_HOME/build-tools/35.0.1/apksigner" verify --verbose dist/BLACK-SIGNAL-HD2D.apk
      - name: Upload APK for testing
        uses: actions/upload-artifact@v4
        with:
          name: BLACK-SIGNAL-HD2D-APK
          path: dist/BLACK-SIGNAL-HD2D.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Native Android launch check
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          cores: 4
          arch: x86_64
          profile: pixel_6
          ram-size: 4096
          heap-size: 512
          disable-animations: true
          emulator-options: -no-window -gpu lavapipe -noaudio -no-boot-anim -no-snapshot -camera-back none
          script: bash black-signal-hd2d/smoke-android.sh
      - name: Upload native screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NATIVE-ANDROID-TEST
          path: |
            dist/lobby.png
            dist/city.png
            dist/failure.png
            dist/android.log
          if-no-files-found: ignore
      - name: Publish development build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "black-signal-hd2d-v0.7.6-${GITHUB_RUN_NUMBER}" dist/BLACK-SIGNAL-HD2D.apk --target "$GITHUB_SHA" --title "BLACK SIGNAL HD2D — v0.7.6 (${GITHUB_RUN_NUMBER})" --notes "Native Godot 2D training scene with rear-view Rin, 742 smoothly resampled and spatially stabilized Rin frames sampled at 90 Hz, alpha-safe mipmapped texture pages, packed into bounded transparent-trimmed pages with rebuilt running, crouch walking and prone crawling, reversible stances, six enemies with new frontal attacks and meter-scaled bodies, front/rear/side atlas selection, vertical aiming and configurable gyroscope. Headless and Android emulator launch tests passed. Physical device playability and AAA graphics are not yet verified." --prerelease
